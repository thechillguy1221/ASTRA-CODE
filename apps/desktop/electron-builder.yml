appId: dev.astra.ai.desktop
productName: Astra Code
directories:
  output: release
  buildResources: build
icon: build/icon.ico
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/codex
    to: codex
  - from: resources/licenses
    to: licenses
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Astra-Code-${version}-win-x64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
protocols:
  - name: Astra Code authentication
    schemes:
      - astra
